name: Build PDF

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64

      - name: Install md-to-pdf
        run: npm install -g md-to-pdf

      - name: Convert README.md to PDF
        run: md-to-pdf README.md
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: false
          PUPPETEER_ARGS: "--no-sandbox --disable-setuid-sandbox"

      - name: Convert README-en.md to PDF
        run: md-to-pdf README-en.md
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: false
          PUPPETEER_ARGS: "--no-sandbox --disable-setuid-sandbox"

      - name: Rename PDF files
        run: |
          mv README.pdf cv-ja.pdf
          mv README-en.pdf cv-en.pdf

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-vitae-pdfs
          path: |
            cv-ja.pdf
            cv-en.pdf
          retention-days: 90

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            cv-ja.pdf
            cv-en.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
