name: Build PDF

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-latex-base \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-lang-japanese \
            texlive-lang-cjk

      - name: Convert README.md to PDF
        run: |
          pandoc README.md \
            -o cv-ja.pdf \
            --pdf-engine=xelatex \
            -V documentclass=article \
            -V geometry:margin=2cm \
            -V CJKmainfont="Noto Sans CJK JP" \
            -V lang=ja

      - name: Convert README-en.md to PDF
        run: |
          pandoc README-en.md \
            -o cv-en.pdf \
            --pdf-engine=xelatex \
            -V documentclass=article \
            -V geometry:margin=2cm \
            -V lang=en

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-vitae-pdfs
          path: |
            cv-ja.pdf
            cv-en.pdf
          retention-days: 90

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            cv-ja.pdf
            cv-en.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
